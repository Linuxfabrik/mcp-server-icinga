site_name: 'Linuxfabrik MCP Server for Icinga'
site_url: 'https://linuxfabrik.github.io/mcp-server-icinga/'
repo_url: 'https://github.com/Linuxfabrik/mcp-server-icinga'
repo_name: 'Linuxfabrik/mcp-server-icinga'

theme:
  name: 'material'
  icon:
    logo: 'material/server-network'
  palette:
    - scheme: 'default'
      primary: 'blue grey'
      accent: 'orange'
      toggle:
        icon: 'material/brightness-7'
        name: 'Switch to dark mode'
    - scheme: 'slate'
      primary: 'blue grey'
      accent: 'orange'
      toggle:
        icon: 'material/brightness-4'
        name: 'Switch to light mode'
  features:
    - content.code.copy
    - navigation.expand
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  links:
    not_found: 'info'
    unrecognized_links: 'info'
  anchors: 'info'

not_in_nav: |
  CODE_OF_CONDUCT.md

nav:
  - 'Home': 'index.md'
  - 'User Guide':
      - 'Introduction': 'user-guide/01 - Introduction.md'
      - 'Installation': 'user-guide/02 - Installation.md'
      - 'Configuration': 'user-guide/03 - Configuration.md'
      - 'Quickstart with Claude': 'user-guide/04 - Quickstart with Claude.md'
      - 'How Tool Discovery Works': 'user-guide/05 - How Tool Discovery Works.md'
      - 'Example Prompts': 'user-guide/06 - Example Prompts.md'
  - 'Developer Guide':
      - 'Source Layout': 'developer-guide/01 - Source Layout.md'
      - 'Design Decisions': 'developer-guide/02 - Design Decisions.md'
  - 'Changelog': 'CHANGELOG.md'
  - 'Contributing': 'contributing.md'
  - 'Security': 'security.md'
